<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>わくせい たしざん（カード版）ver0.7.1</title>

<style>
body{margin:0;background:#000022;color:white;text-align:center;font-family:sans-serif;}
.hidden{display:none;}

.stage-list{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:40px;}
.stage-card{background:#222255;border-radius:16px;padding:20px;cursor:pointer;font-size:20px;width:300px;white-space:nowrap;}

.field{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0;font-size:28px;}
.slot{width:100px;height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.slot img{width:80px;height:80px;}

/* 2桁でも崩れないように幅固定 */
#slotResult{min-width:220px;}

.card{display:inline-block;background:#333366;border-radius:12px;margin:6px;padding:6px;cursor:pointer;}
.card img{width:70px;height:70px;}

.result-box{margin-top:10px;}
.result-box img{width:120px;height:120px;}

.status{margin-top:8px;font-size:16px;}
.score{margin-top:4px;font-size:16px;color:#aaddff;}

.result-dual{display:flex;gap:6px;justify-content:center;}
</style>
</head>

<body>

<div id="menuScreen">
  <h2>レベルをえらぼう</h2>
  <div class="stage-list">
    <div class="stage-card" onclick="startGame(1)">レベル1：ひとけたのたしざん</div>
    <div class="stage-card" onclick="startGame(2)">レベル2：くりあがり</div>
    <div class="stage-card" onclick="startGame(3)">レベル3：まとめ</div>
  </div>
</div>

<div id="gameScreen" class="hidden">
<h2>こたえを えらぼう</h2>

<div class="field">
  <div class="slot" id="slotA"></div>
  <div>＋</div>
  <div class="slot" id="slotB"></div>
  <div>=</div>
  <div class="slot" id="slotResult"></div>
</div>

<div class="result-box">
  <img id="resultImg" src="img/blackhole.png">
  <div class="status" id="status"></div>
  <div class="score" id="score"></div>
</div>

<div id="hand"></div>
</div>

<script>
const planets=[
 {n:0,img:"sun.png"},{n:1,img:"mercury.png"},{n:2,img:"venus.png"},
 {n:3,img:"earth.png"},{n:4,img:"mars.png"},{n:5,img:"jupiter.png"},
 {n:6,img:"saturn.png"},{n:7,img:"uranus.png"},{n:8,img:"neptune.png"},{n:9,img:"pluto.png"}
];

let a,b,answer;
let canInput=false;
let total=0, correct=0;
let level=1;
let input=[];

const menuScreen=document.getElementById("menuScreen");
const gameScreen=document.getElementById("gameScreen");

const hand=document.getElementById("hand");
const slotA=document.getElementById("slotA");
const slotB=document.getElementById("slotB");
const slotResult=document.getElementById("slotResult");
const resultImg=document.getElementById("resultImg");
const statusEl=document.getElementById("status");
const scoreEl=document.getElementById("score");

function startGame(lv){
 level=lv;
 menuScreen.classList.add("hidden");
 gameScreen.classList.remove("hidden");
 total=0;correct=0;input=[];
 createHand();
 nextQuestion();
}

function createHand(){
 hand.innerHTML="";
 planets.forEach(p=>{
  const c=document.createElement("div");
  c.className="card";
  c.innerHTML=`<img src="img/${p.img}">`;
  c.onclick=()=>selectCard(p.n);
  hand.appendChild(c);
 });
}

function nextQuestion(){
 if(total>=5){
   if(correct===5){
     resultImg.src="img/tensai.png";
     speak("ぜんぶ できたね",()=>setTimeout(endGame,1500));
   }else{
     setTimeout(endGame,1000);
   }
   return;
 }

 slotResult.innerHTML="";
 resultImg.src="img/blackhole.png";
 canInput=false;
 input=[];

 do{
  a=Math.floor(Math.random()*10);
  b=Math.floor(Math.random()*10);
  answer=a+b;
 }while(level===1 ? answer>9 : level===2 ? answer<10 : false);

 slotA.innerHTML=`<img src="img/${planets[a].img}">`;
 slotB.innerHTML=`<img src="img/${planets[b].img}">`;

 statusEl.textContent=`${total+1} / 5もん`;
 scoreEl.textContent=`せいかい：${correct} / ${total}`;

 speak(`${a}たす ${b} は？`,()=>canInput=true);
}

function selectCard(num){
 if(!canInput)return;

 input.push(num);

 const isTwoDigit = answer>=10;

 if(level===1 || (level===3 && !isTwoDigit)){
  judge(num);
 }else{
  if(input.length===1){
    slotResult.innerHTML=`<img src="img/${planets[num].img}">`;
  }else if(input.length===2){
    const tens=input[0];
    const ones=input[1];

    slotResult.innerHTML=`
      <div class="result-dual">
        <img src="img/${planets[tens].img}">
        <img src="img/${planets[ones].img}">
      </div>`;

    const value=tens*10+ones;
    judge(value);
  }
 }
}

function judge(value){
 canInput=false;
 total++;

 if(value===answer){
  correct++;
 }

 // 表示（常に正解を見せる）
 if(answer<10){
  slotResult.innerHTML=`<img src="img/${planets[answer].img}">`;
 }else{
  const t=Math.floor(answer/10);
  const o=answer%10;
  slotResult.innerHTML=`
    <div class="result-dual">
      <img src="img/${planets[t].img}">
      <img src="img/${planets[o].img}">
    </div>`;
 }

 resultImg.src = (value===answer) ? "img/correct.png" : "img/zannen.png";

 scoreEl.textContent=`せいかい：${correct} / ${total}`;

 if(value===answer){
  speak("せいかい",()=>setTimeout(nextQuestion,800));
 }else{
  speak(`${a}たす ${b} は ${answer}だよ`,()=>setTimeout(nextQuestion,1200));
 }
}

function endGame(){
 gameScreen.classList.add("hidden");
 menuScreen.classList.remove("hidden");
}

function speak(text,cb){
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="ja-JP";
 u.rate=0.9;
 u.onend=()=>cb&&cb();
 speechSynthesis.speak(u);
}
</script>

</body>
</html>
